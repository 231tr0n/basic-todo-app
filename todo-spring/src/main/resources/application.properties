logging.level.org.springframework.security=INFO
# The MCP tool annotation scanner registers its BeanPostProcessors before the context
# finishes preparing all post-processors, which makes the checker print benign "not
# eligible for getting processed" warnings for its own infrastructure beans (and the
# Flyway migration converter) at every startup. Those warnings are informational only.
logging.level.org.springframework.context.support.PostProcessorRegistrationDelegate$BeanPostProcessorChecker=error

management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=*

server.address=localhost
server.port=9000
spring.application.name=todo
spring.datasource.password=todo
spring.datasource.url=jdbc:mariadb://localhost:3306/todo
spring.datasource.username=todo
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.ai.mcp.server.instructions=Tools for managing users and todos in the todo application.
spring.ai.mcp.server.name=todo-service
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.version=1.0.0
# The MCP streamable HTTP connection and streamed AI proxy responses are long-lived
# servlet async requests; without a generous timeout Tomcat cuts them after ~30s,
# forcing the MCP client to reconnect and flooding the advice with timeout errors.
spring.mvc.async.request-timeout=1800000
spring.threads.virtual.enabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
todo.jwt.expiry=86400
todo.jwt.secret=todo
todo.ai.base-url=http://localhost:11434
