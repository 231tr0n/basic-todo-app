<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
	<p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
	<button matButton type="button" [matDialogClose]="false">Cancel</button>
	<button
		matButton="filled"
		type="button"
		[class.destructive]="data.destructive"
		[matDialogClose]="true">
		{{ data.confirmLabel ?? 'Confirm' }}
	</button>
</mat-dialog-actions>
