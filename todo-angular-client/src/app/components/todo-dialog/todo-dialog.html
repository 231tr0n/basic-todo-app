<h2 mat-dialog-title>{{ isEdit ? 'Edit todo' : 'New todo' }}</h2>
<form (ngSubmit)="save()">
	<mat-dialog-content>
		<mat-form-field>
			<mat-label>Title</mat-label>
			<input matInput name="title" maxlength="255" required [(ngModel)]="title" />
		</mat-form-field>
		<mat-form-field>
			<mat-label>Description</mat-label>
			<textarea
				matInput
				name="description"
				rows="4"
				maxlength="255"
				required
				[(ngModel)]="description"></textarea>
		</mat-form-field>
		<mat-form-field>
			<mat-label>Status</mat-label>
			<mat-select name="status" [(ngModel)]="status">
				@for (column of statuses; track column.status) {
					<mat-option [value]="column.status">{{ column.title }}</mat-option>
				}
			</mat-select>
		</mat-form-field>
	</mat-dialog-content>
	<mat-dialog-actions align="end">
		<button matButton type="button" (click)="cancel()">Cancel</button>
		<button matButton="filled" type="submit" [disabled]="!valid">
			{{ isEdit ? 'Save' : 'Create' }}
		</button>
	</mat-dialog-actions>
</form>
